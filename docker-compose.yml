services:
    vetly:
        container_name: Vetly
        build:
            context: .
            dockerfile: sync/Dockerfile
        restart: unless-stopped
        env_file:
            - ./sync/.env
        volumes:
            - sync-data:/app/sync/data
            - ./public:/app/sync/public:ro
        ports:
            - '127.0.0.1:4000:4000'

    caddy:
        image: caddy:alpine
        restart: unless-stopped
        depends_on:
            - vetly
        network_mode: host
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config

volumes:
    sync-data:
    caddy-data:
    caddy-config:
