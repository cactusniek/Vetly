name: Deploy Frontend

on:
    push:
        branches: [main]
        paths:
            - 'frontend/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/frontend.yml'
    workflow_dispatch:

concurrency:
    group: deploy-frontend
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci --workspace=frontend --include-workspace-root

            - run: npm run build --workspace=frontend

            - name: Upload the build
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_PATH: ${{ secrets.VPS_PATH }}
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
              run: |
                  host=$(echo "$VPS_HOST" | tr -d '[:space:]')
                  user=$(echo "$VPS_USER" | tr -d '[:space:]')
                  path=$(echo "$VPS_PATH" | tr -d '[:space:]')

                  mkdir -p ~/.ssh
                  echo "$VPS_SSH_KEY" > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  ssh-keygen -lf ~/.ssh/deploy

                  rsync -az --delete-after \
                    -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new" \
                    frontend/dist/ \
                    "$user@$host:$path/public/"
